services:
  - type: web
    name: evalforge-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: EVALFORGE_DATASET
        value: evalforge/sample_data.json
